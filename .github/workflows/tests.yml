name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows, because printing uses the Windows API (pywin32).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # The annotate plugin shows each failing test on the run's summary page.
      - run: python -m pip install -r requirements-dev.txt pytest-github-actions-annotate-failures
      - run: python -m pytest -v
